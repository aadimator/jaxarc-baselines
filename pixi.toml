[workspace]
name = "jaxarc-baselines"
authors = ["Aadam <aadimator@gmail.com>"]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[dependencies]
python = ">=3.10,<3.12"
submitit = ">=1.5.2,<2"

[pypi-dependencies]
jaxarc_baselines = { path = ".", editable = true }
JaxARC = { path = "../JaxARC", editable = true }
stoix = { path = "./stoix", editable = true }
arcle = "==0.2.6"

# Add a version constraint for protobuf to fix the TypeError from tensorboard_logger.
protobuf = "~=3.20.0"

[target.linux.pypi-dependencies]
jax = { version = ">=0.4.23", extras = ["cuda12"] }

[target.osx.pypi-dependencies]
jax = { version = ">=0.4.23", extras = ["cpu"] }


[activation.env]
JAX_PLATFORMS = "cuda,cpu"
# CUDA_VISIBLE_DEVICES = "3"
# XLA_FLAGS = "--xla_gpu_autotune_level=0"
JAX_COMPILATION_CACHE_DIR="/tmp/jax_cache"
LD_LIBRARY_PATH = ""

[tasks]
matched-ppo = "python -m jaxarc_baselines.matched_ppo"
matched-ppo-miniarc-h100 = "bash scripts/run_matched_ppo_miniarc_5x5_h100.sh"
matched-ppo-arcagi1-30x30-h100 = "bash scripts/run_matched_ppo_arcagi1_30x30_h100.sh"
matched-ppo-arcagi1-30x30-factorized-h100 = "bash scripts/run_matched_ppo_arcagi1_30x30_factorized_h100.sh"
