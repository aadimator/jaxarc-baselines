# Shallow CNN configuration for value-based ARC runs.
# Value-based systems read `network.actor_network.*` and expect a Q-value head.

actor_network:
  pre_torso:
    _target_: stoix.networks.torso.CNNTorso
    channel_sizes: [32, 32]
    kernel_sizes: [3, 3]
    strides: [1, 1]
    use_layer_norm: False
    activation: silu
    channel_first: False
    hidden_sizes: [128, 128]
  action_head:
    _target_: stoix.networks.heads.DiscreteQNetworkHead
