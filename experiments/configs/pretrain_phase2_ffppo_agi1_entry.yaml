defaults:
  - logger: wandb
  - arch: anakin
  - system: ppo/ff_ppo
  - network: arc_deep_cnn_hwc
  - env: jaxarc/default
  - dataset: arc_agi_1
  - reward: balanced
  - action: raw
  - _self_

arch:
  seed: 42
  total_timesteps: 1000000
  total_num_envs: 128
  num_evaluation: 10
  num_eval_episodes: 8
  evaluation_greedy: true
  absolute_metric: false

system:
  rollout_length: 25
  num_minibatches: 8
  decay_learning_rates: false

hydra:
  searchpath:
    - file://stoix/stoix/configs
    - file://configs
    - pkg://jaxarc.conf

environment:
  max_episode_steps: 150
  debug_level: "minimal"
  auto_reset: true

logging:
  log_operations: true
  log_rewards: true
  log_frequency: 20
  batched_logging_enabled: true

storage:
  base_output_dir: "outputs/research"
  run_name: null
  episodes_dir: "episodes"
  debug_dir: "debug"
  visualization_dir: "visualizations"
  logs_dir: "logs"
  max_episodes_per_run: 1000
  max_storage_gb: 50.0
  cleanup_policy: "manual"
  create_run_subdirs: true
  clear_output_on_start: false

visualization:
  enabled: false
  episode_summaries: false
  step_visualizations: false

wandb:
  enabled: false
  project_name: "jaxarc-experiments"
  entity: null
  tags: ["jaxarc", "phase2-pretrain", "agi1-entry", "deep"]
  notes: "Global FF-PPO pretraining checkpoint for Phase 2 AGI1-entry adaptation."
  group: null
  job_type: "training"
  offline_mode: false
  save_code: true

grid_initialization:
  demo_weight: 1.0
  permutation_weight: 0.0
  empty_weight: 0.0
  random_weight: 0.0
  permutation_types: [rotate, reflect, color_remap]
  random_density: 0.3
  random_pattern_type: sparse

logger:
  base_exp_path: results/
  loggers:
    console:
      enabled: true
    wandb:
      enabled: false
    neptune:
      enabled: false
    json:
      enabled: false
    tensorboard:
      enabled: false
  checkpointing:
    save_model: true
    save_args:
      save_interval_steps: 1
      max_to_keep: 1
      keep_period: ~
      checkpoint_uid: phase2_agi1_entry_deep_pretrain
      rel_dir: results/neurips_ed_phase2/pretrain_checkpoints
    load_model: false

env:
  wrapper: null
  scenario:
    name: AGI1-entry_train
    task_name: agi1_entry_pretrain_phase2