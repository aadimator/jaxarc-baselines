defaults:
  - logger: wandb
  - arch: anakin
  - system: q_learning/ff_dqn
  - network: arc_shallow_cnn_hwc_dqn
  - env: jaxarc/default
  - dataset: mini_arc
  - reward: balanced
  - action: raw
  - _self_

arch:
  seed: 42
  total_timesteps: 5120
  total_num_envs: 8
  num_evaluation: 2
  num_eval_episodes: 4
  evaluation_greedy: true
  absolute_metric: false

system:
  rollout_length: 2
  epochs: 4
  warmup_steps: 16
  total_buffer_size: 65536
  total_batch_size: 128
  decay_learning_rates: false

hydra:
  searchpath:
    - file://stoix/stoix/configs
    - file://configs
    - pkg://jaxarc.conf

environment:
  max_episode_steps: 100
  debug_level: "minimal"
  auto_reset: true

logging:
  log_operations: false
  log_rewards: false
  log_frequency: 20
  batched_logging_enabled: true

storage:
  base_output_dir: "outputs/research/neurips_ed_final_program/r0_feasibility"
  run_name: "r0_ff_dqn_mini_easy"
  episodes_dir: "episodes"
  debug_dir: "debug"
  visualization_dir: "visualizations"
  logs_dir: "logs"
  max_episodes_per_run: 200
  max_storage_gb: 10.0
  cleanup_policy: "manual"
  create_run_subdirs: true
  clear_output_on_start: false

visualization:
  enabled: false
  episode_summaries: false
  step_visualizations: false

wandb:
  enabled: false
  project_name: "jaxarc-experiments"
  entity: null
  tags: ["jaxarc", "final-program", "r0", "ff-dqn", "smoke"]
  notes: "R0 feasibility smoke for FF-DQN on Mini-easy."
  group: null
  job_type: "feasibility"
  offline_mode: false
  save_code: true

grid_initialization:
  demo_weight: 1.0
  permutation_weight: 0.0
  empty_weight: 0.0
  random_weight: 0.0
  permutation_types: [rotate, reflect, color_remap]
  random_density: 0.3
  random_pattern_type: sparse

logger:
  base_exp_path: results/neurips_ed_final_program/r0_feasibility/stoix_logs
  loggers:
    console:
      enabled: true
    wandb:
      enabled: false
    neptune:
      enabled: false
    json:
      enabled: true
    tensorboard:
      enabled: false
  checkpointing:
    save_model: false
    load_model: false

env:
  wrapper: null
  scenario:
    name: Mini-easy
    task_name: mini_easy_r0_ff_dqn
  observation_wrappers:
    answer_grid: true
    input_grid: true
    contextual: true